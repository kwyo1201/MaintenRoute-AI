services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: maintenroute-api
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maintenroute-frontend
    ports:
      - "3000:3000"
    environment:
      FASTAPI_URL: "http://api:8000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
